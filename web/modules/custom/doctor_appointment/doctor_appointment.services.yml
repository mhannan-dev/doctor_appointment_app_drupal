services:
  doctor_appointment.slot_generator:
    class: Drupal\doctor_appointment\Service\SlotGeneratorService
    arguments: ['@entity_type.manager', '@database']

  doctor_appointment.login_redirect:
    class: Drupal\doctor_appointment\EventSubscriber\LoginRedirectSubscriber
    arguments: ['@current_user']
    tags:
      - { name: event_subscriber }
