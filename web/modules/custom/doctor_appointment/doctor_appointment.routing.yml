doctor_appointment.homepage:
  path: '/home'
  defaults:
    _controller: '\Drupal\doctor_appointment\Controller\DashboardController::homepage'
    _title: 'MediCare Hub — Book Your Doctor Appointment Online'
  requirements:
    _access: 'TRUE'

doctor_appointment.patient_dashboard:
  path: '/patient/dashboard'
  defaults:
    _controller: '\Drupal\doctor_appointment\Controller\DashboardController::patientDashboard'
    _title: 'Patient Dashboard'
  requirements:
    _permission: 'access patient dashboard'

doctor_appointment.doctor_dashboard:
  path: '/doctor/dashboard'
  defaults:
    _controller: '\Drupal\doctor_appointment\Controller\DashboardController::doctorDashboard'
    _title: 'Doctor Dashboard'
  requirements:
    _permission: 'access doctor dashboard'

doctor_appointment.admin_dashboard:
  path: '/clinic-admin/dashboard'
  defaults:
    _controller: '\Drupal\doctor_appointment\Controller\DashboardController::adminDashboard'
    _title: 'Clinic Administration Dashboard'
  requirements:
    _permission: 'access clinic admin dashboard'
