services:
  drupal:
    build: .
    ports:
      - 8091:80
    volumes:
      - .:/var/www/html
      - doc_appointment_vendor:/var/www/html/vendor
      - doc_appointment_core:/var/www/html/web/core
    environment:
      DRUPAL_DB_HOST: db
      DRUPAL_DB_PORT: 3306
      DRUPAL_DB_NAME: drupal
      DRUPAL_DB_USER: drupal
      DRUPAL_DB_PASSWORD: drupal
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    command:
      - --innodb_buffer_pool_size=256M
      - --innodb_flush_log_at_trx_commit=2
      - --innodb_redo_log_capacity=128M
      - --max_connections=150
    environment:
      MYSQL_DATABASE: drupal
      MYSQL_USER: drupal
      MYSQL_PASSWORD: drupal
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - doc_appointment_db_data:/var/lib/mysql
    ports:
      - 3309:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  doc_appointment_db_data:
  doc_appointment_vendor:
  doc_appointment_core:
